[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/persistence",
    "crates/wallet-feed",
    "crates/market-data",
    "crates/market-classifier",
    "crates/application",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# Internal crates
tokor-domain = { path = "crates/domain" }
tokor-persistence = { path = "crates/persistence" }
tokor-wallet-feed = { path = "crates/wallet-feed" }
tokor-market-data = { path = "crates/market-data" }
tokor-market-classifier = { path = "crates/market-classifier" }
tokor-application = { path = "crates/application" }
# External
rust_decimal = { version = "1.36", features = ["serde-str"] }
rust_decimal_macros = "1.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
rand = "0.8"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
proptest = "1"
wiremock = "0.6"
# Pinned for later phases (CLOB adapter); not consumed by Phase 1 code paths.
# polymarket_client_sdk_v2 = { version = "0.6", features = ["ws", "gamma"] }

[profile.release]
lto = "thin"
